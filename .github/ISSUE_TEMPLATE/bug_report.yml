name: Bug report
description: Something is wrong in a specification, implementation, or tool.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in as much as you can.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Specification (mlp)
        - Rust core (mlp-core)
        - Browser (mlp-ts)
        - Wire schema (mlp-proto)
        - Conformance (mlp-conformance)
        - Harness (mlp-harness)
        - CLI / tooling
        - Demo
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps or a failing test.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: extra
    attributes:
      label: Additional context